name: IaC validate

# Neither infrastructure tree was validated in CI. This lints and validates the
# Bicep (azure-data-explorer/) and the Cloudflare Terraform (infra/cloudflare-adx/)
# without deploying anything: terraform init runs with -backend=false and no
# provider credentials, so it checks syntax and references only.

on:
  push:
    branches: [main]
    paths:
      - 'azure-data-explorer/**'
      - 'infra/cloudflare-adx/**'
      - '.github/workflows/iac-validate.yml'
  pull_request:
    paths:
      - 'azure-data-explorer/**'
      - 'infra/cloudflare-adx/**'
      - '.github/workflows/iac-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bicep:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and lint Bicep
        shell: bash
        run: |
          shopt -s nullglob
          files=(azure-data-explorer/*.bicep)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Bicep files found; nothing to validate."
            exit 0
          fi
          status=0
          for f in "${files[@]}"; do
            echo "::group::az bicep build $f"
            az bicep build --file "$f" --stdout > /dev/null || status=1
            echo "::endgroup::"
            echo "::group::az bicep lint $f"
            az bicep lint --file "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/cloudflare-adx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend, no providers configured)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
