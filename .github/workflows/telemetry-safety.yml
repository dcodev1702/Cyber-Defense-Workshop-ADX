name: Telemetry safety

# The field profiles in metadata/field-profiles/ are tracked, because they are
# what make the generated telemetry reproducible. That makes this workflow the
# enforcement point that keeps live tenant data out of a public repository.
#
# The same checks run locally through .githooks/pre-commit, but a local hook can
# be skipped with --no-verify and is inert until installed. This cannot.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  field-profile-safety:
    name: Field profiles carry no tenant data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One script enforces both the forbidden-path rules (nothing under sample/,
      # no students/samples csv, no data/generated) and the field-profile tenant
      # scan. The pre-commit hook runs the same script with -Staged, so the hook
      # and CI cannot drift apart.
      - name: Repository safety (paths + field profiles)
        shell: pwsh
        run: ./scripts/Test-RepositorySafety.ps1

  package-integrity:
    name: Manifest, schemas, and profiles agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reconcile manifest against schemas
        shell: pwsh
        run: |
          $manifest = @((Get-Content -Raw metadata/tables.manifest.json | ConvertFrom-Json) | ForEach-Object { $_.name })
          $schemas = @(Get-ChildItem schemas -Filter '*.schema.json' | ForEach-Object { $_.BaseName -replace '\.schema$', '' })

          $missing = @($manifest | Where-Object { $schemas -notcontains $_ })
          $orphan = @($schemas | Where-Object { $manifest -notcontains $_ })

          Write-Host ("Manifest tables : {0}" -f $manifest.Count)
          Write-Host ("Schema files    : {0}" -f $schemas.Count)

          if ($missing.Count -gt 0) {
              Write-Host ("Manifest tables without a schema: {0}" -f ($missing -join ', ')) -ForegroundColor Red
          }
          if ($orphan.Count -gt 0) {
              Write-Host ("Schema files not in the manifest: {0}" -f ($orphan -join ', ')) -ForegroundColor Red
          }
          if ($missing.Count -gt 0 -or $orphan.Count -gt 0) { exit 1 }

          Write-Host 'Manifest and schemas agree.' -ForegroundColor Green

      - name: Confirm profile overrides reference real tables
        shell: pwsh
        run: |
          $manifest = @((Get-Content -Raw metadata/tables.manifest.json | ConvertFrom-Json) | ForEach-Object { $_.name })
          $overrides = Get-Content -Raw metadata/profile-overrides.json | ConvertFrom-Json

          $unknown = @($overrides.PSObject.Properties.Name |
              Where-Object { -not $_.StartsWith('$') -and $manifest -notcontains $_ })

          if ($unknown.Count -gt 0) {
              Write-Host ("profile-overrides.json names tables not in the manifest: {0}" -f ($unknown -join ', ')) -ForegroundColor Red
              exit 1
          }
          Write-Host 'Profile overrides reference known tables.' -ForegroundColor Green
