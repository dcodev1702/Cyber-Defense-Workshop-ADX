name: Gateway tests

# The read-only gateway is the one security-critical code path in the repo, and
# before this workflow existed its test file and npm script were never run in CI.
# This closes that gap: the crash guard, the canonical-forwarding bypass fix, the
# .show allowlist, the database allowlist, and the rate limiter are all covered.

on:
  push:
    branches: [main]
    paths:
      - 'tools/kusto-readonly-gateway/**'
      - '.github/workflows/gateway-tests.yml'
  pull_request:
    paths:
      - 'tools/kusto-readonly-gateway/**'
      - '.github/workflows/gateway-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/kusto-readonly-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependabot bumps the Dockerfile base on its own schedule, so a node-version
      # pinned here drifts away from the runtime the workshop actually ships and CI
      # goes green against a Node the container never runs. It already happened once:
      # the base moved to 25.x while this job still tested 24. Read the version from
      # the Dockerfile so the two cannot disagree.
      - name: Resolve Node version from Dockerfile
        id: node
        run: |
          version=$(sed -n 's|^FROM node:\([0-9][^-]*\).*|\1|p' Dockerfile | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Could not parse a Node version from tools/kusto-readonly-gateway/Dockerfile"
            exit 1
          fi
          echo "Testing against Node $version (from Dockerfile)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      # The gateway has no runtime dependencies; npm ci just verifies the lockfile.
      - name: Install (lockfile check)
        run: npm ci

      - name: Run tests
        run: npm test
