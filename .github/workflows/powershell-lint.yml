name: PowerShell lint

# 25+ PowerShell scripts had no linting. PSScriptAnalyzer runs on ubuntu-latest,
# which is why the Join-Path backslash fix (a literal '\' breaks path resolution
# on Linux) had to land first. The job fails only on Error/ParseError so it is
# green on the current tree; Warnings (Write-Host, missing ShouldProcess, the
# unapproved verb, plaintext-password parameters) surface as annotations to work
# down over time rather than blocking every push.

on:
  push:
    branches: [main]
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '.github/workflows/powershell-lint.yml'
  pull_request:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '.github/workflows/powershell-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze
        shell: pwsh
        run: |
          $paths = @('scripts', 'tools', 'adx_db_backupNrestore')
          $results = foreach ($p in $paths) {
              if (Test-Path $p) { Invoke-ScriptAnalyzer -Path $p -Recurse -Severity Error, Warning, ParseError }
          }

          # ScriptName is the leaf file name, not a path; only ScriptPath is
          # resolvable. Annotating from ScriptName made Resolve-Path fail on the
          # first finding and took the whole job down with it.
          $root = (Get-Location).Path
          foreach ($r in $results) {
              $level = if ($r.Severity -in 'Error', 'ParseError') { 'error' } else { 'warning' }
              $file = $r.ScriptPath
              if ($file -and $file.StartsWith($root)) {
                  $file = $file.Substring($root.Length).TrimStart('/', '\')
              }
              if (-not $file) { $file = $r.ScriptName }
              $file = $file -replace '\\', '/'
              Write-Host ("::{0} file={1},line={2}::{3} - {4}" -f $level, $file, $r.Line, $r.RuleName, $r.Message)
          }

          # The annotation loop must never decide the job outcome; only the
          # error-severity count below does.
          $blocking = @($results | Where-Object { $_.Severity -in 'Error', 'ParseError' })
          $warnings = @($results | Where-Object { $_.Severity -eq 'Warning' })
          "PSScriptAnalyzer: $($blocking.Count) error(s), $($warnings.Count) warning(s)." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($blocking.Count -gt 0) {
              Write-Host "::error::PowerShell lint failed with $($blocking.Count) error-severity finding(s)."
              exit 1
          }

          # Be explicit rather than inheriting the exit status of whatever ran
          # last, which is how this job failed with zero error-severity findings.
          exit 0
