name: cyber-conf-wiesbaden

services:
  kusto:
    # Pinned by digest to the emulator the workshop was actually rehearsed,
    # backed up, and restored against: build 1.0.9697.27504, product version
    # 2026.07.20.1506-2629-8bf4dbb-master. `:latest` moves, and the restore path
    # is only proven for this build -- a persistent database written by one
    # emulator version cannot be attached by another, so a silent tag change
    # between rehearsal and delivery is a data-loss event, not a version bump.
    #
    # Override deliberately with KUSTO_IMAGE (full reference, tag or digest):
    #   $env:KUSTO_IMAGE = 'mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest'
    # Re-pin after rehearsing a new build:
    #   docker image inspect <image> --format '{{index .RepoDigests 0}}'
    image: ${KUSTO_IMAGE:-mcr.microsoft.com/azuredataexplorer/kustainer-linux@sha256:9cd9859c5ebd9d6d5cf81ec2681222ff9c805de49fedb1f6fb901eac7e25dac2}
    container_name: cyber-conf-wiesbaden-kusto
    restart: unless-stopped
    init: true
    entrypoint:
      - /bin/bash
      - -c
      - >-
        rm -rf /kusto/tmp/Kusto.Personal/NetDefaultDB &&
        exec /start-kusto.sh
    stop_signal: SIGINT
    stop_grace_period: 2m
    # Terraform persists this 4 CPU / 24 GiB default in compose.override.yaml.
    cpus: ${KUSTO_CPU_LIMIT:-4.0}
    mem_limit: ${KUSTO_MEMORY_LIMIT:-24g}
    memswap_limit: ${KUSTO_MEMORY_LIMIT:-24g}
    pids_limit: ${KUSTO_PIDS_LIMIT:-2048}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./data/local-kusto
        target: /kustodata
      - type: bind
        source: ./data
        target: /workshop-data
        read_only: true
    networks:
      # Kustainer lives only on the backend network, so `kusto` does not resolve
      # for cloudflared and a hostname-based ingress rule cannot reach it.
      #
      # That is not sufficient on its own. Docker does isolate bridges from each
      # other, but publishing 8080 below inserts an accept ahead of those drops:
      #   -A DOCKER -d <kusto-ip> ! -i br-<backend> -o br-<backend> \
      #      -p tcp --dport 8080 -j ACCEPT
      # which is not restricted by source network, so any container on any other
      # bridge can reach the engine by IP. Binding the host side to 127.0.0.1
      # constrains the host, not other containers.
      #
      # scripts/Set-WorkshopNetworkIsolation.ps1 closes that with a DOCKER-USER
      # rule, and scripts/Test-WorkshopNetworkIsolation.ps1 proves it. The
      # tunnel launcher applies both. Reapply after a Docker engine restart or
      # anything that recreates the networks.
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --request POST
          --header 'Content-Type: application/json'
          --data '{"csl":".show cluster"}'
          http://127.0.0.1:8080/v1/rest/mgmt > /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  kusto-defaultdb-cleaner:
    build:
      context: ./tools/kusto-readonly-gateway
    container_name: cyber-conf-wiesbaden-kusto-defaultdb-cleaner
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - node
      - remove-netdefaultdb.mjs
    depends_on:
      kusto:
        condition: service_healthy
    environment:
      KUSTO_DEFAULT_DATABASE_NAME: NetDefaultDB
      KUSTO_RETAINED_DATABASE_NAME: CyberDefendStudentSnapshot
      KUSTO_STATE_ROOT: /kustodata
      KUSTO_UPSTREAM_URL: http://kusto:8080
    volumes:
      - type: bind
        source: ./data/local-kusto
        target: /kustodata
    networks:
      - backend

  kusto-readonly-gateway:
    build:
      context: ./tools/kusto-readonly-gateway
    container_name: cyber-conf-wiesbaden-kusto-readonly-gateway
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      kusto:
        condition: service_healthy
    environment:
      KUSTO_ALLOWED_ORIGINS: https://dataexplorer.azure.com
      KUSTO_UPSTREAM_URL: http://kusto:8080
      KUSTO_MAX_BODY_BYTES: "1048576"
      # Restrict students to the workshop database. Comment out to allow any db.
      KUSTO_ALLOWED_DATABASES: CyberDefendStudentSnapshot
      # Forced on by default. Set to "false" only if a Kustainer build rejects
      # request_readonly during rehearsal (see the gateway README).
      KUSTO_FORCE_READONLY: ${KUSTO_FORCE_READONLY:-true}
      KUSTO_MAX_SERVER_TIMEOUT_SECONDS: "240"
      KUSTO_MAX_IN_FLIGHT: "8"
    networks:
      # The gateway is the only service on both networks: it accepts edge traffic
      # from cloudflared and forwards to kusto on the backend network.
      - edge
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    container_name: cyber-conf-wiesbaden-cloudflared
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      kusto-readonly-gateway:
        condition: service_healthy
    env_file:
      - path: ./infra/cloudflare-adx/cloudflared.env
        required: false
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:0
      - run
    networks:
      # Edge only, so `kusto` does not resolve here and the connector reaches the
      # emulator through the gateway. The network split alone does not stop an
      # ingress rule that names the backend IP -- see the note on the kusto
      # service and scripts/Set-WorkshopNetworkIsolation.ps1.
      - edge

networks:
  edge:
    name: cyber-conf-wiesbaden-edge
  backend:
    name: cyber-conf-wiesbaden-backend
