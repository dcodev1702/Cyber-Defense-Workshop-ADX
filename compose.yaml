name: cyber-conf-wiesbaden

services:
  kusto:
    # A workshop's reproducibility depends on the emulator version, and :latest can
    # change between rehearsal and delivery. Pin KUSTO_IMAGE_TAG to the digest or
    # version you rehearsed against (e.g. in compose.override.yaml or .env) so the
    # default only floats until you have rehearsed once, not on delivery day.
    image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:${KUSTO_IMAGE_TAG:-latest}
    container_name: cyber-conf-wiesbaden-kusto
    restart: unless-stopped
    init: true
    entrypoint:
      - /bin/bash
      - -c
      - >-
        rm -rf /kusto/tmp/Kusto.Personal/NetDefaultDB &&
        exec /start-kusto.sh
    stop_signal: SIGINT
    stop_grace_period: 2m
    # Terraform persists this 4 CPU / 24 GiB default in compose.override.yaml.
    cpus: ${KUSTO_CPU_LIMIT:-4.0}
    mem_limit: ${KUSTO_MEMORY_LIMIT:-24g}
    memswap_limit: ${KUSTO_MEMORY_LIMIT:-24g}
    pids_limit: ${KUSTO_PIDS_LIMIT:-2048}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./data/local-kusto
        target: /kustodata
      - type: bind
        source: ./data
        target: /workshop-data
        read_only: true
    networks:
      # Kustainer lives only on the backend network. cloudflared is not attached
      # to it, so the connector cannot reach kusto:8080 no matter what the
      # dashboard-managed ingress rule is set to. The read-only gateway is the
      # only path from the edge to the emulator.
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --request POST
          --header 'Content-Type: application/json'
          --data '{"csl":".show cluster"}'
          http://127.0.0.1:8080/v1/rest/mgmt > /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  kusto-defaultdb-cleaner:
    build:
      context: ./tools/kusto-readonly-gateway
    container_name: cyber-conf-wiesbaden-kusto-defaultdb-cleaner
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - node
      - remove-netdefaultdb.mjs
    depends_on:
      kusto:
        condition: service_healthy
    environment:
      KUSTO_DEFAULT_DATABASE_NAME: NetDefaultDB
      KUSTO_RETAINED_DATABASE_NAME: CyberDefendStudentSnapshot
      KUSTO_STATE_ROOT: /kustodata
      KUSTO_UPSTREAM_URL: http://kusto:8080
    volumes:
      - type: bind
        source: ./data/local-kusto
        target: /kustodata
    networks:
      - backend

  kusto-readonly-gateway:
    build:
      context: ./tools/kusto-readonly-gateway
    container_name: cyber-conf-wiesbaden-kusto-readonly-gateway
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      kusto:
        condition: service_healthy
    environment:
      KUSTO_ALLOWED_ORIGINS: https://dataexplorer.azure.com
      KUSTO_UPSTREAM_URL: http://kusto:8080
      KUSTO_MAX_BODY_BYTES: "1048576"
      # Restrict students to the workshop database. Comment out to allow any db.
      KUSTO_ALLOWED_DATABASES: CyberDefendStudentSnapshot
      # Forced on by default. Set to "false" only if a Kustainer build rejects
      # request_readonly during rehearsal (see the gateway README).
      KUSTO_FORCE_READONLY: ${KUSTO_FORCE_READONLY:-true}
      KUSTO_MAX_SERVER_TIMEOUT_SECONDS: "240"
      KUSTO_MAX_IN_FLIGHT: "8"
    networks:
      # The gateway is the only service on both networks: it accepts edge traffic
      # from cloudflared and forwards to kusto on the backend network.
      - edge
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    container_name: cyber-conf-wiesbaden-cloudflared
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      kusto-readonly-gateway:
        condition: service_healthy
    env_file:
      - path: ./infra/cloudflare-adx/cloudflared.env
        required: false
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:0
      - run
    networks:
      # Edge only. cloudflared has no route to the backend network, so it can only
      # reach the gateway, never Kustainer directly.
      - edge

networks:
  edge:
    name: cyber-conf-wiesbaden-edge
  backend:
    name: cyber-conf-wiesbaden-backend
